[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mncs-rights-provenance"
version = "0.3.0"
description = "Rights & provenance subsystem for the MNCS ecosystem: manifests, evidence records, policy evaluation, SPDX mapping."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MNCS Rights & Provenance contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.21"]
dev = ["jsonschema>=4.21", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mncs-rp = "mncs_rights_provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mncs_rights_provenance = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
